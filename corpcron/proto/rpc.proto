syntax = "proto3";
package corpcron.rpc;

enum ErrorCode {
    OK = 0;
    BAD_REQUEST = 1;
    UNKNOWN_METHOD = 2;
    PAYLOAD_TOO_LARGE = 3;
    INTERNAL_ERROR = 4;
    DB_ERROR = 5;
    HANDLER_NOT_FOUND = 6;
    UNAUTHORIZED = 7;
}

message RpcError {
    ErrorCode code = 1;
    string message = 2;
}

message EchoRequest {
    string message = 1;
    string auth_token = 2;
}
message EchoResponse {
    string message = 1;
}

message SubmitTaskRequest {
    string cron_expr = 1;
    string params = 2;
    string handler = 3;
    string auth_token = 4;
}
message SubmitTaskResponse {
    string task_id = 1;
    bool success = 2;
    string error = 3;
}

// 远程执行任务请求
message ExecuteTaskRequest {
    string task_id = 1;
    string params = 2;
    string handler = 3;
    string auth_token = 4;
}
message ExecuteTaskResponse {
    bool success = 1;
    string result = 2;
    string error = 3;
}

message CancelTaskRequest {
    string task_id = 1;
    string auth_token = 2;
}
message CancelTaskResponse {
    bool success = 1;
    string error = 2;
}
