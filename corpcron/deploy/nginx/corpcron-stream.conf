# Example Nginx stream configuration for CorpCron RPC TLS termination.
# Put this file under /etc/nginx/conf.d/ only if nginx.conf includes stream snippets,
# or copy the stream block into /etc/nginx/nginx.conf.

stream {
    log_format corpcron_stream '$remote_addr [$time_local] '
                               '$protocol $status $bytes_sent $bytes_received '
                               '$session_time "$upstream_addr"';

    upstream corpcron_rpc_backend {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
        # Add more nodes only when they are reachable from this Nginx host.
        # server 10.0.0.12:8081 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8443 ssl;
        proxy_pass corpcron_rpc_backend;
        proxy_connect_timeout 3s;
        proxy_timeout 60s;

        ssl_certificate /etc/letsencrypt/live/corpcron.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/corpcron.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:CORPCRON_STREAM_SSL:10m;
        ssl_session_timeout 10m;

        access_log /var/log/nginx/corpcron-rpc-access.log corpcron_stream;
        error_log /var/log/nginx/corpcron-rpc-error.log warn;
    }
}
