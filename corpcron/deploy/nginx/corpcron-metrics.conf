# Example HTTPS reverse proxy for CorpCron /metrics, /alerts and /health.
# This is optional. For production, prefer scraping metrics from a private network.

server {
    listen 9443 ssl http2;
    server_name corpcron-metrics.example.com;

    ssl_certificate /etc/letsencrypt/live/corpcron-metrics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corpcron-metrics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/corpcron-metrics-access.log;
    error_log /var/log/nginx/corpcron-metrics-error.log warn;

    # Replace these CIDRs with your office/VPN/monitoring network.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    # Optional extra protection:
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.corpcron_metrics.htpasswd prometheus
    # auth_basic "CorpCron metrics";
    # auth_basic_user_file /etc/nginx/.corpcron_metrics.htpasswd;

    location = /health {
        proxy_pass http://127.0.0.1:9091/health;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:9091/metrics;
    }

    location = /alerts {
        proxy_pass http://127.0.0.1:9091/alerts;
    }

    location / {
        return 404;
    }
}
