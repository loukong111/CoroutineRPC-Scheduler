global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: corpcron
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9091
        labels:
          role: control
          instance: local-node-1

  - job_name: corpcron-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9191
        labels:
          role: worker
          instance: local-worker-1

  # Enable these targets for local two-node demos.
