[server]
bind_host = 0.0.0.0
advertise_host = 127.0.0.1
listen_port = 8082
node_id =
daemon = 0
log_level = info
max_connections = 1024

[rpc]
auth_token =

[rpc_executor]
min_threads = 2
max_threads = 8
backlog_threshold = 8
idle_timeout_sec = 5
max_pending_requests = 256

[metrics]
enabled = 1
host = 0.0.0.0
port = 9092

[alerts]
min_rpc_requests = 100
rpc_error_rate_percent = 5
min_task_executions = 10
task_failure_rate_percent = 20
min_lock_attempts = 10
lock_failure_rate_percent = 50
schedule_delay_p99_ms = 5000
task_duration_p99_ms = 10000

[scheduler]
worker_service_name = worker
misfire_policy = once
misfire_grace_seconds = 300
task_timeout_ms = 5000
running_stale_timeout_sec = 120
rpc_pool_max_idle_per_endpoint = 4
rpc_pool_failure_threshold = 2
rpc_pool_cooldown_ms = 3000

[redis]
host = 127.0.0.1
port = 6380
pool_size = 4
connect_timeout_ms = 1000
command_timeout_ms = 1000

[mysql]
host = 127.0.0.1
port = 3307
user = corpcron
password = corpcron_dev_password
database = corpcron
pool_size = 4
connect_timeout_sec = 3
read_timeout_sec = 5
write_timeout_sec = 5
reconnect = 1
