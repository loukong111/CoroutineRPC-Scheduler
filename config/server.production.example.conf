[server]
bind_host = 127.0.0.1
advertise_host = 127.0.0.1
listen_port = 8081
node_id =
daemon = 0
log_level = info
max_connections = 2048

[rpc]
auth_token =

[metrics]
enabled = 1
host = 127.0.0.1
port = 9091

[alerts]
min_rpc_requests = 100
rpc_error_rate_percent = 5
min_task_executions = 10
task_failure_rate_percent = 20
min_lock_attempts = 10
lock_failure_rate_percent = 50
schedule_delay_p99_ms = 5000
task_duration_p99_ms = 10000

[scheduler]
misfire_policy = once
misfire_grace_seconds = 300
task_timeout_ms = 5000
running_stale_timeout_sec = 120
rpc_pool_max_idle_per_endpoint = 8
rpc_pool_failure_threshold = 2
rpc_pool_cooldown_ms = 3000

[redis]
host = 127.0.0.1
port = 6379
pool_size = 8
connect_timeout_ms = 1000
command_timeout_ms = 1000

[mysql]
host = 127.0.0.1
port = 3306
user = corpcron
password =
database = corpcron
pool_size = 8
connect_timeout_sec = 3
read_timeout_sec = 5
write_timeout_sec = 5
reconnect = 1
