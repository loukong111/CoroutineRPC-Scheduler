syntax = "proto3";
package corpcron.rpc;

enum ErrorCode {
    OK = 0;
    BAD_REQUEST = 1;
    UNKNOWN_METHOD = 2;
    PAYLOAD_TOO_LARGE = 3;
    INTERNAL_ERROR = 4;
    DB_ERROR = 5;
    HANDLER_NOT_FOUND = 6;
    UNAUTHORIZED = 7;
}

message RpcError {
    ErrorCode code = 1;
    string message = 2;
}

message EchoRequest {
    string message = 1;
    string auth_token = 2;
}
message EchoResponse {
    string message = 1;
}

message SubmitTaskRequest {
    string cron_expr = 1;
    string params = 2;
    string handler = 3;
    string auth_token = 4;
}
message SubmitTaskResponse {
    string task_id = 1;
    bool success = 2;
    string error = 3;
}

// 远程执行任务请求
message ExecuteTaskRequest {
    string task_id = 1;
    string params = 2;
    string handler = 3;
    string auth_token = 4;
}
message ExecuteTaskResponse {
    bool success = 1;
    string result = 2;
    string error = 3;
}

message CancelTaskRequest {
    string task_id = 1;
    string auth_token = 2;
}
message CancelTaskResponse {
    bool success = 1;
    string error = 2;
}

message TaskInfo {
    string id = 1;
    string cron_expr = 2;
    string params = 3;
    string handler = 4;
    int32 status = 5;
    string next_run_at = 6;
    string last_run_at = 7;
    int32 retry_count = 8;
    int32 max_retries = 9;
    string current_execution_id = 10;
    string running_node = 11;
    string started_at = 12;
}

message ListTasksRequest {
    string auth_token = 1;
    int32 limit = 2;
    bool enabled_only = 3;
    int32 offset = 4;
    int32 status_filter = 5; // -1 means all statuses, 0 disabled, 1 scheduled, 2 running.
    string keyword = 6;
    bool has_status_filter = 7;
}
message ListTasksResponse {
    bool success = 1;
    string error = 2;
    repeated TaskInfo tasks = 3;
    int32 total = 4;
    int32 offset = 5;
    int32 limit = 6;
}

message TaskHistoryInfo {
    string execution_id = 1;
    string task_id = 2;
    string exec_node = 3;
    bool success = 4;
    string result = 5;
    string error = 6;
    string start_time = 7;
    string end_time = 8;
}

message ListHistoryRequest {
    string auth_token = 1;
    string task_id = 2;
    int32 limit = 3;
    int32 offset = 4;
    int32 success_filter = 5; // -1 means all, 0 failed, 1 succeeded.
    string keyword = 6;
    bool has_success_filter = 7;
}
message ListHistoryResponse {
    bool success = 1;
    string error = 2;
    repeated TaskHistoryInfo history = 3;
    int32 total = 4;
    int32 offset = 5;
    int32 limit = 6;
}

message ListServicesRequest {
    string auth_token = 1;
    string service_name = 2;
}
message ListServicesResponse {
    bool success = 1;
    string error = 2;
    repeated string endpoints = 3;
}

message UpdateTaskRequest {
    string auth_token = 1;
    TaskInfo task = 2;
}
message UpdateTaskResponse {
    bool success = 1;
    string error = 2;
}

message EnableTaskRequest {
    string auth_token = 1;
    string task_id = 2;
    bool enabled = 3;
}
message EnableTaskResponse {
    bool success = 1;
    string error = 2;
}

message DeleteTaskRequest {
    string auth_token = 1;
    string task_id = 2;
}
message DeleteTaskResponse {
    bool success = 1;
    string error = 2;
}

message RunTaskNowRequest {
    string auth_token = 1;
    string task_id = 2;
}
message RunTaskNowResponse {
    bool success = 1;
    string result = 2;
    string error = 3;
}

message GetMetricsRequest {
    string auth_token = 1;
}
message GetMetricsResponse {
    bool success = 1;
    string error = 2;
    uint64 rpc_requests_total = 3;
    uint64 rpc_success_total = 4;
    uint64 rpc_error_total = 5;
    uint64 active_connections = 6;
    uint64 rejected_connections = 7;
    uint64 malformed_frames = 8;
    uint64 bytes_in_total = 9;
    uint64 bytes_out_total = 10;
    uint64 task_success_total = 11;
    uint64 task_failure_total = 12;
    uint64 lock_acquire_success_total = 13;
    uint64 lock_acquire_failure_total = 14;
    uint64 max_task_duration_ms = 15;
    uint64 task_duration_p95_ms = 16;
    uint64 task_duration_p99_ms = 17;
    uint64 task_duration_samples_total = 18;
    uint64 schedule_delay_max_ms = 19;
    uint64 schedule_delay_p95_ms = 20;
    uint64 schedule_delay_p99_ms = 21;
    uint64 schedule_delay_samples_total = 22;
}

message HealthCheckRequest {
    string service_name = 1;
    string auth_token = 2;
}
message HealthCheckResponse {
    bool serving = 1;
    string status = 2;
    string node_id = 3;
    uint64 unix_time_ms = 4;
}

message StreamMetricsRequest {
    string auth_token = 1;
    int32 samples = 2;
}
message StreamMetricsResponse {
    bool success = 1;
    string error = 2;
    uint32 sequence = 3;
    bool end_of_stream = 4;
    GetMetricsResponse metrics = 5;
}

service CorpCronRpc {
    rpc Echo(EchoRequest) returns (EchoResponse);
    rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
    rpc ExecuteTask(ExecuteTaskRequest) returns (ExecuteTaskResponse);
    rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
    rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
    rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
    rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
    rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
    rpc EnableTask(EnableTaskRequest) returns (EnableTaskResponse);
    rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
    rpc RunTaskNow(RunTaskNowRequest) returns (RunTaskNowResponse);
    rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc StreamMetrics(StreamMetricsRequest) returns (stream StreamMetricsResponse);
}
